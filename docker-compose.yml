services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: ${MONGO_CONTAINER_NAME:-mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-rideflow}
    volumes:
      - mongo_data:/data/db
    networks:
      - rideflow-network

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - rideflow-network

  compass:
    image: ${COMPASS_IMAGE:-haohanyang/compass-web:latest}
    container_name: ${COMPASS_CONTAINER_NAME:-compass-web}
    restart: unless-stopped
    environment:
      - CW_MONGO_URI=${CW_MONGO_URI:-mongodb://mongo:27017}
    ports:
      - "${COMPASS_PORT:-8085}:8080"
    depends_on:
      - mongo
    networks:
      - rideflow-network

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: ${MAILPIT_CONTAINER_NAME:-mailpit}
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - rideflow-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  rideflow-network:
    driver: bridge
